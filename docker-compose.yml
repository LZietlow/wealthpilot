services:
  postgres:
    image: postgres:16
    container_name: wealthpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wealthpilot
      POSTGRES_PASSWORD: wealthpilot_dev_pw
      POSTGRES_DB: wealthpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: